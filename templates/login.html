{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-8 sm:mt-16 px-2">
    <div class="bg-white shadow-2xl rounded-3xl p-6 sm:p-8">
        <h2 class="text-2xl sm:text-3xl font-bold text-center mb-6 sm:mb-8 text-green-700">Welcome Back</h2>

        <form method="POST">
            {% csrf_token %}
            <div class="space-y-4 sm:space-y-6">
                <style>
                    .auth-form p {
                        display: flex;
                        align-items: center;
                        gap: 0.5rem;
                    }
                    .auth-form label {
                        white-space: nowrap;
                        font-weight: 500;
                    }
                    .auth-form input {
                        flex: 1;
                        border: 1px solid #d1d5db;
                        border-radius: 0.75rem;
                        padding: 0.5rem 0.75rem;
                    }
                    .auth-form input:focus {
                        border-color: #16a34a;
                        outline: none;
                        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
                    }
                </style>
                <div class="auth-form">
                    {{ form.as_p }}
                </div>
            </div>
            <button type="submit"
                class="mt-6 sm:mt-8 w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-3 sm:py-4 rounded-2xl text-base sm:text-lg transition">
                Login
            </button>
        </form>

        <p class="text-center mt-5 text-gray-600 text-sm sm:text-base">
            Don't have an account?
            <a href="{% url 'register' %}" class="text-green-700 font-medium">Register Here</a>
        </p>
    </div>
</div>
{% endblock %}
