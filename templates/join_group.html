{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow-xl rounded-3xl p-10">
    <h1 class="text-3xl font-bold text-center mb-6">Join a Chama</h1>
    <p class="text-gray-600 text-center mb-8">Enter the 8-character join code provided by your group organizer.</p>

    <form method="POST" action="{% url 'join_group' %}">
        {% csrf_token %}
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-semibold mb-2" for="join_code">Join Code</label>
            <input type="text" name="join_code" id="join_code"
                class="w-full border border-gray-300 px-4 py-3 rounded-2xl" placeholder="e.g. ABC123YZ" required
                maxlength="8" style="text-transform:uppercase;">
        </div>

        <button type="submit"
            class="w-full bg-green-700 text-white font-bold py-4 rounded-2xl hover:bg-green-800 transition">
            Join Chama
        </button>
        <div class="mt-6 text-center">
            <a href="{% url 'dashboard' %}" class="text-sm font-medium text-green-700 hover:text-green-800">Back to
                Dashboard</a>
        </div>
    </form>
</div>
{% endblock %}
