{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-8 sm:mt-16 px-4">
    <div class="bg-white shadow-2xl rounded-3xl p-8 sm:p-10">
        <h2 class="text-2xl sm:text-3xl font-bold text-center mb-3 text-green-700">Join a Chama</h2>
        <p class="text-gray-500 text-center mb-8 text-sm">
            Enter the 8-character join code provided by your group organizer.
        </p>

        <form method="POST" action="{% url 'join_group' %}" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="join_code" class="block text-sm font-semibold text-gray-700 mb-1">
                    Join Code
                </label>
                <input type="text" name="join_code" id="join_code"
                       placeholder="e.g. ABC123YZ"
                       required maxlength="8"
                       style="text-transform: uppercase;"
                       class="join-input">
            </div>

            <button type="submit"
                class="mt-4 w-full bg-green-700 hover:bg-green-800 active:bg-green-900
                       text-white font-semibold py-3.5 rounded-2xl text-base sm:text-lg
                       transition duration-200 shadow-md hover:shadow-lg">
                Join Chama
            </button>

            <div class="text-center">
                <a href="{% url 'dashboard' %}" class="text-sm font-medium text-green-700 hover:underline">
                    ← Back to Dashboard
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    .join-input {
        display: block;
        width: 100%;
        border: 1.5px solid #d1d5db;
        border-radius: 0.75rem;
        padding: 0.65rem 0.85rem;
        font-size: 1.125rem;
        letter-spacing: 0.2em;
        font-family: monospace;
        text-align: center;
        color: #111827;
        background: #f9fafb;
        transition: border-color 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
    }
    .join-input:focus {
        border-color: #16a34a;
        outline: none;
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        background: #fff;
    }
</style>
{% endblock %}
