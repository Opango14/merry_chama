{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto mt-6 sm:mt-10 px-2">
    <div class="bg-white shadow-2xl rounded-3xl px-6 sm:px-10 py-8">
        <h2 class="text-2xl sm:text-3xl font-bold text-center mb-6 sm:mb-8 text-green-700">
            Create New Merry-Go-Round
        </h2>

        <form method="POST">
            {% csrf_token %}
            <div class="space-y-5 sm:space-y-8">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Group Name</label>
                    {{ form.name }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contribution Amount (Kshs)</label>
                    {{ form.contribution_amount }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Savings Rate (%)</label>
                    {{ form.savings_rate }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Frequency</label>
                    {{ form.frequency }}
                </div>
            </div>

            <button type="submit"
                class="mt-8 sm:mt-10 w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-4 sm:py-5 rounded-2xl text-lg sm:text-xl transition">
                Create Chama Group
            </button>
        </form>
    </div>

    <p class="text-center text-sm text-gray-500 mt-6 sm:mt-8">
        Tip: Start with the people you trust. You can invite more members later.
    </p>
</div>
{% endblock %}
