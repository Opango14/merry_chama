{% extends "base.html" %}
{% block content %}
<div class="flex flex-col items-center text-center py-12 sm:py-20 px-4 gap-6 sm:gap-8">


    <!-- SplitText target: heading -->
    <h1 id="hero-heading"
        class="text-4xl sm:text-5xl lg:text-6xl font-bold text-green-700 leading-tight split-parent">
        Merry-Go-Round + Smart Savings
    </h1>

    <!-- Tagline — hidden initially by GSAP (not CSS), revealed after heading finishes -->
    <p id="hero-tagline"
       class="text-lg sm:text-2xl text-gray-600 split-parent">
        Contribute • Rotate • Save • Share
    </p>

    <!-- CTA — hidden initially by GSAP, slides up after tagline finishes -->
    <a id="hero-cta"
       href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'register' %}{% endif %}"
       class="inline-block bg-green-600 text-white text-base sm:text-xl px-8 sm:px-10 py-3 sm:py-4 rounded-2xl font-semibold hover:bg-green-700 transition">
        Start Your Chama Today
    </a>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.fonts.ready.then(() => {

    /* Hide tagline & CTA via GSAP so the parent elements stay in the DOM
       and layout is preserved — Tailwind opacity-0 on the parent breaks
       child-span animations because the parent never becomes visible. */
    gsap.set('#hero-tagline', { opacity: 0, y: 16 });
    gsap.set('#hero-cta',     { opacity: 0, y: 20 });

    /* Step 1: Heading — char-by-char with slight rotation */
    SplitText('#hero-heading', {
        splitType : 'chars',
        delay     : 40,
        duration  : 0.7,
        ease      : 'power3.out',
        from      : { opacity: 0, y: 48, rotate: 8 },
        to        : { opacity: 1, y: 0,  rotate: 0 },
        threshold : 0.05,
        rootMargin: '0px',
        textAlign : 'center',
        onLetterAnimationComplete: () => {

            /* Step 2: Make tagline parent fully visible FIRST,
               then SplitText animates the individual word spans inside it */
            gsap.set('#hero-tagline', { opacity: 1, y: 0 });

            SplitText('#hero-tagline', {
                splitType : 'words',
                delay     : 80,
                duration  : 0.6,
                ease      : 'power2.out',
                from      : { opacity: 0, y: 24 },
                to        : { opacity: 1, y: 0  },
                threshold : 0.05,
                rootMargin: '0px',
                textAlign : 'center',
                onLetterAnimationComplete: () => {

                    /* Step 3: CTA slides up below the tagline */
                    gsap.to('#hero-cta', {
                        opacity  : 1,
                        y        : 0,
                        duration : 0.5,
                        ease     : 'power2.out'
                    });
                }
            });
        }
    });
});
</script>
{% endblock %}
